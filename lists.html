<!DOCTYPE html>
 <html>
  <head>
    <title> ordered and unordered lists </title>
  </head>
      <body>
      <h4> Ordered lists</h4>
       <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
       </ol>
      <h4> Unordered lists</h4>
       <ul>
        <li> Apple </li>
        <li> Banana </li>
        <li> Mango </li>
        <li> Orange </li>
        <li> Grapes </li>
       </ul>
     </body>
   </html>
