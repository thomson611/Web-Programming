<!DOCTYPE html>
 <html>
  <head>
   <title>String and Math function</title>
  </head>
  <body>
   <h2>String Object Functions</h2>
   <script>
    let str = "Hello JavaScript";
    document.write("Original String:"+str+"<br><br>");
    document.write("Length:"+ str.length +"<br>");
    document.write("Uppercase:"+str.toUpperCase()+"<br>");
    document.write("Lowecase:"+str.toLowerCase()+"<br><br>");
    document.write("Character at position 1:"+str.charAt(1)+"<br><br>");
    document.write("Index of Javacript:"+str.indexOf("Javascript")+"<br>");
    document.write("Substring:"+str.substring(0,5)+"<br>");
    document.write("Replace:"+str.replace("Javascript","World")+"<br>");
    document.write("<br>");
    document.write("<h2> Math Object Functions </h2>");
    let number = 25.6;
    document.write("Number:"+number+"<br><br>");
    document.write("Round:"+Math.round(number)+"<br>");
    document.write("ceiling:"+Math.ceil(number)+"<br>");
    document.write("Floor:"+Math.floor(number)+"<br>");
    document.write("SquareRoot:"+Math.sqrt(25)+"<br>");
    document.write("Power:"+Math.pow(5,2)+"<br>");
    document.write("Absolute value:"+Math.abs(-10)+"<br>");
    document.write("Random Number:"+Math.random()+"<br>");
  </script>
 </body>
</html>
