<!DOCTYPE html>
 <html>
  <head>
   <title> Mouse Event</title>
  </head>
  <body>
    <h2> Mouse Event Handling </h2>
    <h3
      onmouseover = "changeContent()"
      onmouseout = "restoreContent()"
      id  = "heading">
    Move Mouse Here
   </h3>
    <p id = "text">
       This is the original text
    </p>
    <img id = "image" src = "image1.jpg" width = "400" height = "250">
   <script>
      function changeContent()
       {
        document.getElementById("heading").innerHTML = "Welcome to Javascript";
        document.getElementById("text").innerHTML = "You moved the mouse over the content!";
        document.getElementById("image").src = "image2.jpg";
       }
       function restoreContent()
        {
        document.getElementById("heading").innerHTML = "Move Mouse Here";
        document.getElementById("text").innerHTML = "This is the original text";
        document.getElementById("image").src="image1.jpg";
        }
     </script>
   </body>
 </html>
